<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Палитра кода — учим языки программирования</title>
<meta name="description" content="Короткие уроки по 20 языкам программирования. Каждый язык в своём цвете.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#">Палитра кода</a>
  <select id="jump" aria-label="Быстрый переход к языку"></select>
  <button id="theme" type="button" aria-label="Сменить тему">Тема</button>
</header>

<main id="home">
  <h1>Выбери язык, <br>с которого начнёшь</h1>
  <p class="lead" id="stats"></p>
  <div class="tools">
    <input id="q" type="search" placeholder="Найти язык (нажми /)" aria-label="Поиск языка">
    <button id="rnd" type="button">Случайный язык</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Ничего не найдено. Попробуй другое название или категорию.</p>
</main>

<main id="lang" hidden>
  <a class="back" href="#">Все языки</a>
  <header class="hero">
    <div class="glyph" id="glyph"></div>
    <div>
      <h1 id="name"></h1>
      <p class="tag" id="tag"></p>
      <p class="about" id="about"></p>
      <div class="meter"><i id="meter"></i></div>
      <p class="small" id="prog"></p>
    </div>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="code">
    <div class="bar"><span id="file"></span><button id="copy" type="button">Копировать</button></div>
    <pre><code id="code"></code></pre>
  </section>
  <div class="actions">
    <button id="prev" type="button">Назад</button>
    <button id="done" type="button"></button>
    <button id="next" type="button">Дальше</button>
  </div>
  <p class="small" id="note"></p>
</main>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="app.js"></script>
</body>
</html>
