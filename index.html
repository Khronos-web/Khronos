<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Палитра кода — учим языки программирования</title>
<meta name="description" content="Короткие уроки по популярным языкам программирования. Каждый язык в своём цвете.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Языки программирования">
    <a class="brand" href="#">Палитра кода</a>
    <ul id="langs"></ul>
  </nav>
  <main>
    <header class="hero">
      <h1 id="name"></h1>
      <p id="tag" class="tag"></p>
      <p id="about" class="about"></p>
    </header>
    <div class="tabs" id="tabs" role="tablist"></div>
    <section class="code" aria-live="polite">
      <div class="bar"><span id="file"></span><button id="copy" type="button">Копировать</button></div>
      <pre><code id="code"></code></pre>
    </section>
    <p class="note" id="note"></p>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
